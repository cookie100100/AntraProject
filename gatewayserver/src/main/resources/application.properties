spring.application.name=gatewayserver
server.port=8080
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Eureka Discovery (to discover other services)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Gateway Route Configurations
spring.cloud.gateway.routes[0].id=inventory-service
spring.cloud.gateway.routes[0].uri=lb://inventory-service  # lb:// uses LoadBalancer to resolve the service
spring.cloud.gateway.routes[0].predicates=Path=/inventory/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service  # lb:// uses LoadBalancer to resolve the service
spring.cloud.gateway.routes[1].predicates=Path=/orders/**

spring.main.web-application-type=reactive
